[package]
name = "effect-attest"
description = "Kernel-observed effects of each MCP tools/call (exec, open-for-write, connect), attributed by cgroup v2 and signed as in-toto statements in DSSE envelopes."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["mcp", "ebpf", "in-toto", "attestation", "dsse"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "effect_attest"
path = "src/lib.rs"

[[bin]]
name = "effect-attest"
path = "src/main.rs"

[[bin]]
name = "ea-workload"
path = "src/bin/ea-workload.rs"

[dependencies]
effect-attest-common = { path = "../effect-attest-common" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
